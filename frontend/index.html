<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Organic: Organic Virgin Coconut Oil, Syrup &amp; Soap | Thailand</title>

    <!--
      Site-wide defaults, served to crawlers that don't run JavaScript (link
      previews on LINE/Facebook, most LLM crawlers). Every page overrides
      these at runtime via <Seo> (src/components/Seo.jsx), which edits these
      same tags in place rather than adding duplicates. Deliberately absent
      here: canonical and og:url — a static one would claim every URL on the
      site is the homepage; <Seo> sets them per route instead.
    -->
    <meta
      name="description"
      content="Organic virgin coconut oil, coconut flower syrup, and coconut oil soap. Cold-pressed and handcrafted in small batches by One Organic (Thailand). Available on Shopee."
    />
    <meta property="og:site_name" content="One Organic" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="One Organic: Organic Virgin Coconut Oil, Syrup &amp; Soap | Thailand" />
    <meta
      property="og:description"
      content="Organic virgin coconut oil, coconut flower syrup, and coconut oil soap. Cold-pressed and handcrafted in small batches by One Organic (Thailand). Available on Shopee."
    />
    <meta property="og:image" content="https://one-organic.com/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Caveat:wght@600&family=Inter:wght@400;500&family=Archivo:wght@500;600;700&family=Anton&family=Courier+Prime:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
