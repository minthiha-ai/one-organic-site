name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Load deploy key into ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLUEHOST_DEPLOY_KEY }}

      - name: Trust Bluehost host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 box2414.bluehost.com >> ~/.ssh/known_hosts

      - name: Deploy to Bluehost
        run: |
          ssh iyzcoomy@box2414.bluehost.com '
            set -e
            cd ~/repositories/one-organic-platform
            git pull origin master
            cd backend
            /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan filament:clear-cached-components
            php artisan optimize:clear
          '
