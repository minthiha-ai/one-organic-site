name: Deploy Backend

# Manual-only as of 2026-09-17: Bluehost is blocking inbound SSH from
# GitHub Actions' runner IPs at the network edge (still open with Bluehost
# support — see the Backend CI/CD section in README for the current status).
# Routine deploys now happen via backend/bin/deploy.sh, run on a schedule by
# a Bluehost cron job that pulls from GitHub itself (outbound only). This
# workflow stays available as a manual fallback — e.g. once the firewall
# issue is resolved, or to force a deploy without waiting for the next tick.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Load deploy key into ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLUEHOST_DEPLOY_KEY }}

      - name: Trust Bluehost host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 box2414.bluehost.com >> ~/.ssh/known_hosts

      - name: Deploy to Bluehost
        run: |
          ssh iyzcoomy@box2414.bluehost.com '
            set -e
            cd ~/repositories/one-organic-platform
            git pull origin master
            cd backend
            /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan filament:clear-cached-components
            php artisan optimize:clear
          '
